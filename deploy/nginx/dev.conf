# SmartNavbat — dev-stack internal nginx. This container is not exposed to
# the host; the production edge nginx (deploy/nginx/prod.conf, server_name
# dev.smartnavbat.uz) terminates TLS and proxies everything here in plain
# HTTP over the shared docker network. Same rate-limit/cache behavior as
# prod so load tests against dev see realistic behavior.

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# Every request here arrives via the production edge nginx (prod.conf),
# which proxies dev.smartnavbat.uz over the shared docker network and sets
# X-Forwarded-For to the true client IP. Without this, $remote_addr is
# always the edge container's own address -- the /tgwh/ Telegram-IP
# allowlist below would reject every real Telegram webhook (403), and the
# per-IP rate-limit zones would share one bucket across every dev visitor.
# 172.18.0.0/16 is smartnavbat_default, the network the edge container
# lives on -- only a peer connecting from inside it can override
# $remote_addr this way.
set_real_ip_from 172.18.0.0/16;
real_ip_header X-Forwarded-For;

limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pub_zone:10m  rate=60r/s;

proxy_cache_path /var/cache/nginx/pub levels=1:2 keys_zone=pubcache:20m
                 max_size=128m inactive=10s;

geo $telegram_net {
    default          0;
    149.154.160.0/20 1;
    91.108.4.0/22    1;
}

upstream api_up { server api:8000; keepalive 64; }
upstream bot_up { server bot:8081; keepalive 32; }

server {
    listen 80 default_server;
    server_name dev.smartnavbat.uz _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /tgwh/ {
        if ($telegram_net = 0) { return 403; }
        client_max_body_size 2m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://bot_up;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        # Upstream keepalive needs HTTP/1.1 with an empty Connection header;
        # without both, nginx talks HTTP/1.0 and opens a fresh TCP connection
        # to uvicorn for EVERY request, so the pool declared on the upstream
        # never applies. Repeating the four common headers is mandatory: a
        # proxy_set_header here cancels every inherited one.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_up;
    }

    location /api/public/ {
        limit_req zone=pub_zone burst=120 nodelay;
        proxy_cache pubcache;
        proxy_cache_valid 200 1s;
        proxy_cache_key $request_uri;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        # Upstream keepalive needs HTTP/1.1 with an empty Connection header;
        # without both, nginx talks HTTP/1.0 and opens a fresh TCP connection
        # to uvicorn for EVERY request, so the pool declared on the upstream
        # never applies. Repeating the four common headers is mandatory: a
        # proxy_set_header here cancels every inherited one.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_up;
    }

    location /api/ws/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://api_up;
    }

    location /api/ {
        limit_req zone=api_zone burst=200 nodelay;
        client_max_body_size 3m;
        # Upstream keepalive needs HTTP/1.1 with an empty Connection header;
        # without both, nginx talks HTTP/1.0 and opens a fresh TCP connection
        # to uvicorn for EVERY request, so the pool declared on the upstream
        # never applies. Repeating the four common headers is mandatory: a
        # proxy_set_header here cancels every inherited one.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_up;
    }

    location /media/ {
        # Upstream keepalive needs HTTP/1.1 with an empty Connection header;
        # without both, nginx talks HTTP/1.0 and opens a fresh TCP connection
        # to uvicorn for EVERY request, so the pool declared on the upstream
        # never applies. Repeating the four common headers is mandatory: a
        # proxy_set_header here cancels every inherited one.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache pubcache;
        proxy_cache_valid 200 30s;
        proxy_pass http://api_up;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
