# SmartNavbat — production nginx (mounted over /etc/nginx/conf.d/default.conf
# in the `frontend` container by docker-compose.prod.yml).
#
# This file lives in the http{} context, so zones/maps/upstreams are allowed.
# TLS certificates come from the host's /etc/letsencrypt (read-only mount);
# issue them BEFORE the first `docker compose up` — see
# docs/PRODUCTION_SERVER_SETUP.md §7.

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json image/svg+xml text/plain;

# ---- per-IP rate-limit zones (tight for credentials, generous elsewhere) ----
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=pub_zone:10m  rate=60r/s;

# ---- 1-second micro-cache for the public read endpoints -------------------
# 10,000 clients refreshing their ticket page cost ~one upstream request per
# second after this; live updates flow over the WebSocket anyway.
proxy_cache_path /var/cache/nginx/pub levels=1:2 keys_zone=pubcache:20m
                 max_size=128m inactive=10s;

# ---- Telegram webhook source ranges (defense-in-depth; the real auth is the
# per-bot HMAC secret checked in-app). Verify the current list at
# https://core.telegram.org/bots/webhooks before a big event. --------------
geo $telegram_net {
    default          0;
    149.154.160.0/20 1;
    91.108.4.0/22    1;
}

upstream api_up { server api:8000; keepalive 64; }
upstream bot_up { server bot:8081; keepalive 32; }

# ---- port 80: ACME challenges + redirect to https -------------------------
# IPv6 loopback is bound too: container healthchecks resolve "localhost" to
# ::1 first, and an IPv4-only listen fails those with connection refused
# even though the site is fine (Docker's port-publishing masks this for
# external traffic by NATing to the container's IPv4 address).
server {
    listen 80 backlog=4096;
    listen [::]:80 backlog=4096;
    server_name smartnavbat.uz www.smartnavbat.uz;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    location / { return 301 https://smartnavbat.uz$request_uri; }
}

# ---- www → apex ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.smartnavbat.uz;

    ssl_certificate     /etc/letsencrypt/live/smartnavbat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartnavbat.uz/privkey.pem;

    return 301 https://smartnavbat.uz$request_uri;
}

# ---- the site --------------------------------------------------------------
server {
    listen 443 ssl backlog=4096;
    listen [::]:443 ssl backlog=4096;
    http2 on;
    server_name smartnavbat.uz;

    ssl_certificate     /etc/letsencrypt/live/smartnavbat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/smartnavbat.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ========================================================================
    # Telegram webhooks: NO per-IP limit_req here. Ever. Telegram funnels the
    # whole registration burst through a handful of its own IPs; a per-IP
    # limit would throttle Telegram itself into retry loops on the most
    # important path in the system.
    # ========================================================================
    location /tgwh/ {
        if ($telegram_net = 0) { return 403; }
        client_max_body_size 2m;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://bot_up;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://api_up;
    }

    location /api/public/ {
        limit_req zone=pub_zone burst=120 nodelay;
        proxy_cache pubcache;
        proxy_cache_valid 200 1s;
        proxy_cache_key $request_uri;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status;
        proxy_pass http://api_up;
    }

    location /api/ws/ {
        proxy_http_version 1.1;
        # NOTE: proxy_set_header in a location cancels ALL inherited ones —
        # the four common headers must be repeated here.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://api_up;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        client_max_body_size 3m;   # logo uploads are capped at 2 MB in-app
        proxy_pass http://api_up;
    }

    location /media/ {
        proxy_pass http://api_up;
        proxy_cache pubcache;
        proxy_cache_valid 200 30s;
    }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # hashed build assets are immutable — cache hard. `expires` (not
    # add_header) so the server-level security headers stay inherited.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback; index.html itself must never be cached
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
