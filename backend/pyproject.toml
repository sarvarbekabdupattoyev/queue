[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "navbat-backend"
version = "1.0.0"
description = "NAVBAT — multi-tenant queue management backend (FastAPI + Telegram bots)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128,<0.129",
    "uvicorn[standard]>=0.34,<0.35",
    "sqlalchemy>=2.0.36,<2.1",
    "aiosqlite>=0.20,<0.21",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyJWT>=2.10,<3",
    "bcrypt>=4.2,<5",
    "qrcode[pil]>=8.0,<9",
    "aiogram>=3.17,<4",
    "python-multipart>=0.0.20",
    "redis>=5.2,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
]
postgres = [
    "asyncpg>=0.30",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
