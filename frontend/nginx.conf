# Per-IP rate limits: generous for the app, tight for credential endpoints.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

# Upstream connection pools: reused instead of a fresh TCP connection per
# request, which needs HTTP/1.1 and an empty Connection header below.
upstream api_up { server api:8000; keepalive 32; }
upstream bot_up { server bot:8081; keepalive 16; }

# "Connection: upgrade" belongs ONLY on requests that actually ask to upgrade.
# Sending it on every /api/ call (as this file used to) is wrong for plain
# HTTP and defeats upstream keepalive; an empty value is what enables it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri /index.html;
    }

    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_up;
    }

    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live displays and panels upgrade here; everything else stays plain
        # HTTP/1.1 over a pooled connection
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_pass http://api_up;
    }

    location /media/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api_up;
    }

    # Telegram webhooks go straight to the bot service. No per-IP limit —
    # they all come from Telegram's data centers and are secret-validated.
    location /tgwh/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://bot_up;
    }
}
