<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efefed" />
    <meta
      name="description"
      content="SmartNavbat — sotuv kunlari uchun onlayn navbat tizimi. Telegram bot orqali ro'yxat, QR skanerlash va jonli navbat."
    />
    <title>SmartNavbat — onlayn navbat tizimi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%232e3d39'/%3E%3Ccircle cx='8.6' cy='21' r='2.5' fill='%23c9ebd3' opacity='.5'/%3E%3Ccircle cx='15.2' cy='16' r='3.1' fill='%23c9ebd3' opacity='.75'/%3E%3Ccircle cx='22.6' cy='10.4' r='3.9' fill='%23c9ebd3'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the stored/system theme before first paint (no flash).
      ;(function () {
        try {
          var stored = localStorage.getItem('sn_theme')
          var dark =
            stored === 'dark' ||
            ((stored === null || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          if (dark) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#131715')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
